
name: Build HAIKAL OS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract HAIKAL OS
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project not found"
            exit 1
          fi
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      
      - name: Find Gradle project
        run: |
          BUILD_DIR=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$BUILD_DIR" ]; then
            echo "Gradle settings file not found!"
            exit 1
          fi
          echo "PROJECT_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Found project at $BUILD_DIR"
