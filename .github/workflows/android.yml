name: Build HAIKAL OS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract HAIKAL OS
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' -type f | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project not found"
            exit 1
          fi
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Build APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HAIKAL-OS-APK
          path: project/app/build/outputs/apk/debug/*.apk
